[project]
name = "flightwatch"
version = "0.1.0"
description = "Watch award flight availability and alert when redemptions drop below your mileage thresholds"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "click>=8.1",
    "rich>=13.7",
]

[project.scripts]
flightwatch = "flightwatch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightwatch"]

# Pinned so a shell with UV_INDEX_URL set to an internal mirror cannot bake that
# host into uv.lock. This is a public repo; the lock must resolve against PyPI.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
