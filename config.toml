# Deployed configuration, used by the GitHub Actions schedule.
# Local ad-hoc runs use ~/.config/flightwatch/config.toml instead.
# Credentials come from repository secrets, never from this file.

# Relative to the workspace. Restored from and saved to the Actions cache each run so
# dedupe survives between runs -- without it every run re-alerts everything.
state_path = "state.db"

[provider]
kind = "seats_aero"
api_key_env = "SEATS_AERO_API_KEY"
requests_per_minute = 60
taxes_in_cents = true
# A real seats.aero UI URL with only route and date substituted, params in original
# order. Trimming the ones that look irrelevant makes the page load without running the
# search. max_fees is raised from 40000 ($400) so the link can't filter out the very
# award being alerted.
booking_url_template = "https://seats.aero/search?min_seats=1&applicable_cabin=any&additional_days=true&additional_days_num=7&max_fees=999999&disable_live_filtering=true&date={date}&origins={origin}&destinations={destination}&view=default"

[dedupe]
cooldown_days = 3
realert_on_improvement = 5000

# Push notification for the Chase watches only.
[[notify]]
kind = "telegram"
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id_env = "TELEGRAM_CHAT_ID"
watches = [
  "SFO -> Dublin, business, Chase-transferable",
  "SFO -> London, business, Chase-transferable",
]

# Unscoped, so the non-Chase watches still reach a channel and get recorded. In CI this
# only lands in the Actions run log -- widen the telegram `watches` list above if you
# want those on your phone too.
[[notify]]
kind = "console"

# --- Dublin -----------------------------------------------------------------
# Listed first so an award matching both watches is attributed to this one.
# Chase Ultimate Rewards transfer partners only. Neither American (57,500) nor Alaska
# (70,000) is a Chase partner, so this sits quiet until transferable business space
# appears at 80k or below.
[[watch]]
name = "SFO -> Dublin, business, Chase-transferable"
origins = ["SFO"]
destinations = ["DUB"]
programs = ["@chase"]
depart_after = "+21d"
depart_before = "+330d"
return_trip = { min_days = 7, max_days = 14 }

  [[watch.thresholds]]
  cabin = "business"
  max_miles = 80000

# Any program, so the cheap AA/Alaska space stays visible even though it needs miles
# from outside Chase. max_taxes drops the ~$749 British Airways fuel surcharge on
# routings via London -- remove that line to see every match.
[[watch]]
name = "SFO -> Dublin, business, any program"
origins = ["SFO"]
destinations = ["DUB"]
depart_after = "+21d"
depart_before = "+330d"
return_trip = { min_days = 7, max_days = 14 }

  [[watch.thresholds]]
  cabin = "business"
  max_miles = 80000
  max_taxes = 50

# --- London -----------------------------------------------------------------
# "LON" is expanded to the London airports at config load: seats.aero accepts the city
# code in a search, but returns records keyed by airport (LHR, LGW), so an unexpanded
# "LON" would match nothing.

[[watch]]
name = "SFO -> London, business, Chase-transferable"
origins = ["SFO"]
destinations = ["LON"]
programs = ["@chase"]
depart_after = "+21d"
depart_before = "+330d"
return_trip = { min_days = 7, max_days = 14 }

  [[watch.thresholds]]
  cabin = "business"
  max_miles = 80000

[[watch]]
name = "SFO -> London, business, any program"
origins = ["SFO"]
destinations = ["LON"]
depart_after = "+21d"
depart_before = "+330d"
return_trip = { min_days = 7, max_days = 14 }

  [[watch.thresholds]]
  cabin = "business"
  max_miles = 80000
  max_taxes = 50
