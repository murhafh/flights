# Deployed configuration, used by the GitHub Actions schedule.
# Local ad-hoc runs use ~/.config/flightwatch/config.toml instead.
# Credentials come from repository secrets, never from this file.

# Relative to the workspace. Restored from and saved to the Actions cache each run so
# dedupe survives between runs -- without it every run re-alerts everything.
state_path = "state.db"

[provider]
kind = "seats_aero"
api_key_env = "SEATS_AERO_API_KEY"
requests_per_minute = 60
taxes_in_cents = true
# Links are disabled: an empty template makes every notifier omit the link entirely
# rather than print a dead one. The /search URL populated the cities but never ran the
# search, and the app only deep-links /i/* paths whose format we could not determine.
# Restore by putting the seats.aero URL back here.
booking_url_template = ""

[dedupe]
cooldown_days = 3
realert_on_improvement = 5000

# Push notification for the Chase watches only.
[[notify]]
kind = "telegram"
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id_env = "TELEGRAM_CHAT_ID"
watches = [
  "SFO -> Dublin, business, Chase-transferable",
  "SFO -> London, business, Chase-transferable",
  "SFO -> Frankfurt, business, Chase-transferable, nonstop",
  "LHR -> SFO, business, Chase-transferable",
]

# Unscoped echo of every deal into the Actions run log, useful for debugging.
# counts_as_delivery = false because nobody reads that log: if it counted, a successful
# console write would mask a failed Telegram send and suppress the alert for the whole
# cooldown. That happened on 2026-09-04 and cost a real notification.
[[notify]]
kind = "console"
counts_as_delivery = false

# --- Dublin -----------------------------------------------------------------
# Listed first so an award matching both watches is attributed to this one.
# Chase Ultimate Rewards transfer partners only. Neither American (57,500) nor Alaska
# (70,000) is a Chase partner, so this sits quiet until transferable business space
# appears at 80k or below.
[[watch]]
name = "SFO -> Dublin, business, Chase-transferable"
origins = ["SFO"]
destinations = ["DUB"]
programs = ["@chase"]
depart_after = "+21d"
depart_before = "+330d"
return_trip = { min_days = 7, max_days = 14 }

  [[watch.thresholds]]
  cabin = "business"
  max_miles = 80000

# Any program, so the cheap AA/Alaska space stays visible even though it needs miles
# from outside Chase. max_taxes drops the ~$749 British Airways fuel surcharge on
# routings via London -- remove that line to see every match.
[[watch]]
name = "SFO -> Dublin, business, any program"
enabled = false   # paused: console-only, so it never reached Telegram anyway
origins = ["SFO"]
destinations = ["DUB"]
depart_after = "+21d"
depart_before = "+330d"
return_trip = { min_days = 7, max_days = 14 }

  [[watch.thresholds]]
  cabin = "business"
  max_miles = 80000
  max_taxes = 50

# --- London -----------------------------------------------------------------
# "LON" is expanded to the London airports at config load: seats.aero accepts the city
# code in a search, but returns records keyed by airport (LHR, LGW), so an unexpanded
# "LON" would match nothing.

[[watch]]
name = "SFO -> London, business, Chase-transferable"
origins = ["SFO"]
destinations = ["LON"]
programs = ["@chase"]
depart_after = "+21d"
depart_before = "+330d"
return_trip = { min_days = 7, max_days = 14 }

  [[watch.thresholds]]
  cabin = "business"
  max_miles = 80000

[[watch]]
name = "SFO -> London, business, any program"
enabled = false   # paused: console-only, so it never reached Telegram anyway
origins = ["SFO"]
destinations = ["LON"]
depart_after = "+21d"
depart_before = "+330d"
return_trip = { min_days = 7, max_days = 14 }

  [[watch.thresholds]]
  cabin = "business"
  max_miles = 80000
  max_taxes = 50

# --- Frankfurt ---------------------------------------------------------------
# Added as the practical way to reach Leipzig: there is no SFO->LEJ award space at all
# (Leipzig has no long-haul service and seats.aero does not build that O&D), but
# FRA->LEJ has plenty of onward award space, so Frankfurt works as a connection point.

[[watch]]
name = "SFO -> Frankfurt, business, Chase-transferable, nonstop"
origins = ["SFO"]
destinations = ["FRA"]
programs = ["@chase"]
depart_after = "+21d"
depart_before = "+330d"
return_trip = { min_days = 7, max_days = 14 }

  [[watch.thresholds]]
  cabin = "business"
  max_miles = 80000
  # Nonstop only. Note the return leg is held to the same rule, so a paired return
  # must also be nonstop. Drop this line to accept connections again.
  nonstop_only = true

# --- London -> SFO (one-way home) --------------------------------------------
# Inbound one-way. No return_trip: the "return" would be another outbound to London,
# which the SFO -> London watch already covers.

[[watch]]
name = "LHR -> SFO, business, Chase-transferable"
origins = ["LHR"]
destinations = ["SFO"]
programs = ["@chase"]
depart_after = "+21d"
depart_before = "+330d"

  [[watch.thresholds]]
  cabin = "business"
  max_miles = 80000
