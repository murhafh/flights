# A flexible-destination watch: any of these European cities counts.
[[watch]]
name = "West coast -> Europe, business"
origins = ["SFO", "OAK", "SJC"]
destinations = ["LHR", "CDG", "AMS", "FRA", "MAD", "LIS"]
programs = ["aeroplan", "flyingblue", "virginatlantic"]
depart_after = "+21d"
depart_before = "+300d"

  [[watch.thresholds]]
  cabin = "business"
  max_miles = 70000
  max_taxes = 150
  min_seats = 2

# Two cabins on one route, each with its own bar.
[[watch]]
name = "Asia, business or a first-class splurge"
origins = ["SFO", "LAX"]
destinations = ["HND", "NRT", "SIN", "BKK", "HKG"]
depart_after = "+30d"
depart_before = "+330d"

  [[watch.thresholds]]
  cabin = "business"
  max_miles = 75000

  [[watch.thresholds]]
  cabin = "first"
  max_miles = 120000
  min_seats = 1

# A narrow, high-conviction watch: nonstop only, low surcharges, specific dates.
[[watch]]
name = "Spring break Tokyo, nonstop"
origins = ["SFO"]
destinations = ["HND"]
depart_after = "2027-03-13"
depart_before = "2027-03-22"
airlines_exclude = []

  [[watch.thresholds]]
  cabin = "business"
  max_miles = 90000
  max_taxes = 100
  min_seats = 2
  nonstop_only = true
