# Example configuration. Copy to ~/.config/flightwatch/config.toml, or generate a
# starter with `flightwatch init`. Validate edits with `flightwatch check`.

state_path = "~/.local/state/flightwatch/state.db"

[provider]
kind = "seats_aero"              # or "mock" for deterministic sample data
api_key_env = "SEATS_AERO_API_KEY"
requests_per_minute = 60         # keep at or below your plan's rate limit
taxes_in_cents = false           # set true if `probe` shows taxes 100x too large

[dedupe]
cooldown_days = 3                # re-alert an unchanged award after this long (0 = never)
realert_on_improvement = 5000    # ...or immediately if it drops this many miles

[[notify]]
kind = "console"

# [[notify]]
# kind = "telegram"
# bot_token_env = "TELEGRAM_BOT_TOKEN"
# chat_id_env = "TELEGRAM_CHAT_ID"

# [[notify]]
